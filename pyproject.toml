[project]
name = "ankiweb"
version = "0.1.0"
requires-python = ">=3.12"
# Derivative of Anki (AGPL-3.0-or-later) + AnkiConnect (GPL-3.0-or-later); the combined
# work is AGPL-3.0-or-later. See LICENSE + THIRD-PARTY-NOTICES.md.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "tsc", email = "xxj.tan@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "anki==26.9.3",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "websockets==17.2",  # uvicorn needs a WS library for real /ws connections (the bridge)
    "httpx==0.28.1",
    "python-multipart==0.0.32",  # FastAPI UploadFile (the /upload_media paste-image endpoint)
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "playwright>=1.44"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ankiweb*"]
