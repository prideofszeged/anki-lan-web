name: anki-lan-web

services:
  app:
    build:
      context: .
      target: runtime
    image: local/anki-lan-web:26.09.3
    container_name: anki-lan-web
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      ANKIWEB_COLLECTION: /data/anki/collection.anki2
      ANKIWEB_IMPORT_TMP_DIR: /data/import-tmp
      ANKIWEB_HOST: 0.0.0.0
      ANKIWEB_PORT: 8000
      ANKIWEB_ALLOWED_HOSTS: ${ANKIWEB_ALLOWED_HOSTS:-127.0.0.1,localhost,192.168.1.7}
      ANKIWEB_SOURCE_URL: ${ANKIWEB_SOURCE_URL:-https://github.com/prideofszeged/anki-lan-web/tree/feat/modular-mobile-v1}
      ANKIWEB_SECURE_COOKIE: ${ANKIWEB_SECURE_COOKIE:-false}
      ANKIWEB_INIT_COLLECTION: ${ANKIWEB_INIT_COLLECTION:-false}
      ANKIWEB_MULTI_USER: ${ANKIWEB_MULTI_USER:-false}
      ANKIWEB_DATA_ROOT: /data
      ANKIWEB_MAX_ACTIVE_RUNTIMES: ${ANKIWEB_MAX_ACTIVE_RUNTIMES:-4}
      ANKIWEB_RUNTIME_IDLE_SECONDS: ${ANKIWEB_RUNTIME_IDLE_SECONDS:-900}
      ANKIWEB_RUNTIME_WAIT_SECONDS: ${ANKIWEB_RUNTIME_WAIT_SECONDS:-30}
      ANKIWEB_TRUSTED_PROXY_CIDRS: ${ANKIWEB_TRUSTED_PROXY_CIDRS:-}
      ANKIWEB_INSECURE_COOKIE_OK: ${ANKIWEB_INSECURE_COOKIE_OK:-false}
      TMPDIR: /data/tmp
      TZ: ${TZ:-America/New_York}
    ports:
      - "127.0.0.1:18082:8000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 2.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # LAN HTTPS front (SPEC section 13). Opt-in: `docker compose --profile lan up -d`.
  # Binds ONE explicit LAN address, never 0.0.0.0. Pin the digest at cutover (T13).
  proxy:
    profiles: ["lan"]
    build:
      context: .
      dockerfile: deploy/proxy/Dockerfile
    image: local/anki-lan-proxy:2.8.4
    container_name: anki-lan-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      ANKIWEB_LAN_HOST: ${ANKIWEB_LAN_HOST:-192.168.1.7}
    ports:
      - "${ANKIWEB_LAN_BIND:-192.168.1.7}:18443:18443"
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    read_only: true
    tmpfs:
      - /config:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 128m
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy-data:
